<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SpendWise</h1>
    <p>Track your budget. Spend wisely.</p>
  </header>

  <main>
    <section class="card">
      <h2>How it works</h2>
      <p>When this page loads, SpendWise will ask for your name, monthly budget and expenses using pop-up prompts.</p>
      <p>Open the browser console (press <strong>F12</strong> &rarr; <strong>Console</strong>) to see your budget summary.</p>
      <button onclick="location.reload()">Run SpendWise Again</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SpendWise</p>
  </footer>

  <!-- JavaScript linked at the end of body so the page loads first -->
  <script src="script.js"></script>
</body>
</html>
